<body>
    <main class="auth-shell" id="container">
        <section class="form-container sign-up" aria-label="Crear cuenta">

                <h1>Crear <span class="accent">cuenta</span></h1>

                <button class="primary-button" type="submit">Crear cuenta →</button>
                <p class="result" id="register-result"></p>
                <p class="or-label">O CONTINÚE CON</p>
                <div class="social-icons"><button type="button"><span class="brand-icon google-icon" aria-hidden="true">G</span>Google</button><button type="button"><span class="brand-icon facebook-icon" aria-hidden="true">f</span>Facebook</button></div>
                <button class="mode-link" type="button" id="login-inline">¿Ya tienes una cuenta? Iniciar sesión</button>
            </form>
        </section>
        <section class="form-container sign-in" aria-label="Iniciar sesión">
            <form id="login-form" novalidate>

                <label class="field-label" for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" aria-describedby="correo-error" required>
                <p class="field-error" id="correo-error" aria-live="polite"></p>

                <p class="field-error" id="password-error" aria-live="polite"></p>
                <button class="primary-button" type="submit" id="login-submit">Iniciar sesión →</button>

                <p class="or-label">O CONTINÚA CON</p>

                <button class="mode-link" type="button" id="register-inline"><span class="login-mode-text">¿No tienes una cuenta? </span><span class="login-mode-link">Crear cuenta</span></button>
            </form>
        </section>
        <div class="welcome" id="welcome"><div class="welcome-check">✓</div><h2>¡Bienvenido!</h2><p>Tu cuenta fue creada correctamente.</p></div>

        };
        const auth = getAuth(initializeApp(firebaseConfig));
        const userKey = 'valve-store-user';

        document.getElementById('register-inline').addEventListener('click', () => document.getElementById('container').classList.add('active'));
        document.getElementById('login-inline').addEventListener('click', () => document.getElementById('container').classList.remove('active'));
        document.getElementById('password-toggle').addEventListener('click', () => {
            const password = document.getElementById('password');
            const button = document.getElementById('password-toggle');
            const showing = password.type === 'text';
            password.type = showing ? 'password' : 'text';
            button.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
            button.setAttribute('aria-pressed', String(!showing));
        });

        const showResult = (node, text, isError = true) => {
            node.textContent = text;
            node.className = isError ? 'result error' : 'result success';
        };
        const getAuthErrorMessage = (error) => {
            const messages = {
                'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Inicia sesión.',
                'auth/invalid-credential': 'El correo o la contraseña no son correctos.',
                'auth/invalid-email': 'Escribe un correo electrónico válido.',
                'auth/network-request-failed': 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.',
                'auth/operation-not-allowed': 'Correo y contraseña no están habilitados en Firebase Authentication.',
                'auth/unauthorized-domain': 'Este dominio no está autorizado. Usa localhost o agrégalo en Authentication → Configuración → Dominios autorizados.',
                'auth/api-key-not-valid': 'La clave de API de Firebase no es válida. Copia de nuevo firebaseConfig desde la app web correcta.',
                'auth/configuration-not-found': 'No se encontró la configuración de Authentication para este proyecto. Revisa que Authentication esté configurado en el mismo proyecto de la app.',
                'auth/project-not-found': 'No se encontró el proyecto de Firebase configurado en Login.html.',
                'auth/too-many-requests': 'Hubo demasiados intentos. Espera un momento e inténtalo de nuevo.',
                'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.'
            };
            return messages[error.code] || `No se pudo completar la autenticación. Código de Firebase: ${error.code || 'desconocido'}.`;
        };
        const setLoading = (button, isLoading, label) => {
            button.disabled = isLoading;
            button.innerHTML = isLoading
                ? `<span class="spinner" aria-hidden="true"></span>${label}`
                : button.dataset.originalLabel;
            button.classList.toggle('is-loading', isLoading);
        };
        const continueToChat = async (user, name = user.displayName || '') => {
            const email = user.email;
            if (!email) {
                throw new Error('La cuenta autenticada no tiene un correo electrónico.');
            }
            try {
                localStorage.setItem(userKey, JSON.stringify({
                    uid: user.uid,
                    name,
                    email
                }));
            } catch (error) {
                console.error('No se pudo guardar la sesión local.', error);
                await signOut(auth);
                throw new Error('El navegador no permitió guardar la sesión. Habilita el almacenamiento local e inténtalo de nuevo.');
            }
            window.location.assign('Chat.html');
        };

        const loginForm = document.getElementById('login-form');
        const loginButton = document.getElementById('login-submit');
        const loginResult = document.getElementById('resultado');
        loginButton.dataset.originalLabel = loginButton.textContent.trim();
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!loginForm.reportValidity()) return;
            loginResult.textContent = '';
            setLoading(loginButton, true, 'Iniciando sesión…');
            try {
                const credential = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('correo').value.trim(),
                    document.getElementById('password').value
                );
                await continueToChat(credential.user);
            } catch (error) {
                console.error('No se pudo iniciar sesión.', error);
                showResult(loginResult, error.code ? getAuthErrorMessage(error) : error.message);
            } finally {
                setLoading(loginButton, false);
            }
        });

        const registerForm = document.getElementById('register-form');
        const registerButton = registerForm.querySelector('button[type="submit"]');
        const registerResult = document.getElementById('register-result');
        registerButton.dataset.originalLabel = registerButton.textContent.trim();
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!registerForm.reportValidity()) return;
            registerResult.textContent = '';
            setLoading(registerButton, true, 'Creando cuenta…');
            try {
                const credential = await createUserWithEmailAndPassword(
                    auth,
                    document.getElementById('register-correo').value.trim(),
                    document.getElementById('register-password').value
                );
                const name = document.getElementById('nombre').value.trim();
                await updateProfile(credential.user, { displayName: name });
                showResult(registerResult, 'Cuenta creada. Abriendo la tienda…', false);
                await continueToChat(credential.user, name);
            } catch (error) {
                console.error('No se pudo crear la cuenta.', error);
                showResult(registerResult, error.code ? getAuthErrorMessage(error) : error.message);
            } finally {
                setLoading(registerButton, false);
            }
        });

        document.querySelectorAll('.social-icons button').forEach((button) => {
            button.addEventListener('click', () => {
                const result = button.closest('form').querySelector('.result');
                showResult(result, 'Google y Facebook todavía no están habilitados. Usa correo y contraseña.');
            });
        });
    </script>
</body>
</html>
